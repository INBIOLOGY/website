<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINE Login Callback — INBIOLOGY Academy</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./css/style.css?v=20260919_v21">
  <style>
    body { min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F8FAFC;font-family:var(--font-body,'Inter',sans-serif);flex-direction:column;gap:16px; }
    .callback-card { background:white;border-radius:24px;padding:48px 40px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.08);max-width:420px;width:90%; }
    .spinner { width:44px;height:44px;border:4px solid #E2E8F0;border-top-color:#06C755;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 20px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .status-title { font-size:18px;font-weight:800;color:#0F172A;margin:0 0 8px; }
    .status-sub { font-size:13px;color:#64748B;margin:0; }
    .error-box { background:#FEF2F2;border:1px solid #FCA5A5;border-radius:12px;padding:14px;color:#DC2626;font-size:13px;margin-top:16px;display:none; }
  </style>
</head>
<body>
  <div class="callback-card">
    <div style="font-size:48px;margin-bottom:12px">??</div>
    <div class="spinner" id="spinner"></div>
    <h1 class="status-title" id="status-title">กำลังเข้าสู่ระบบด้วย LINE...</h1>
    <p class="status-sub" id="status-sub">กรุณารอสักครู่ ระบบกำลังตรวจสอบข้อมูลของคุณ</p>
    <div class="error-box" id="error-box"></div>
  </div>
  <script src="./js/mockData.js"></script>
  <script src="./js/supabaseConfig.js"></script>
  <script src="./js/lineConfig.js"></script>
  <script src="./js/cloudService.js"></script>
  <script src="./js/app.js"></script>
  <script>
    function showError(msg) {
      document.getElementById('spinner').style.display='none';
      document.getElementById('status-title').textContent='เข้าสู่ระบบไม่สำเร็จ';
      document.getElementById('status-sub').textContent='กรุณาลองใหม่อีกครั้ง';
      const eb=document.getElementById('error-box');eb.style.display='block';eb.textContent=msg;
      setTimeout(()=>{location.href='login.html';},3500);
    }
    function showSuccess(name) {
      document.getElementById('spinner').style.display='none';
      document.getElementById('status-title').textContent='?? ยินดีต้อนรับ '+name+'!';
      document.getElementById('status-sub').textContent='เข้าสู่ระบบสำเร็จ กำลังนำคุณไปยังห้องเรียน...';
    }
    function decodeJwt(token) {
      try {
        const b=token.split('.')[1];
        const j=decodeURIComponent(atob(b.replace(/-/g,'+').replace(/_/g,'/')).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''));
        return JSON.parse(j);
      } catch(e){ return null; }
    }
    async function processLineUser(info) {
      const name=info.name||'LINE User';
      const profile={lineId:info.sub,fullName:name,nickname:name.split(' ')[0],email:info.email||('line_'+info.sub+'@line.user'),avatar:info.picture||'',school:'ยังไม่ได้ระบุ',level:'ม.5',role:'student',authProvider:'line'};
      AppState.userRole='student';sessionStorage.setItem('inbiology_session_active','true');localStorage.setItem('inbiology_role','student');AppState.saveStudentProfile(profile);
      showSuccess(name);
      const r=sessionStorage.getItem('line_redirect')||'classroom.html';sessionStorage.removeItem('line_redirect');
      setTimeout(()=>{location.href=r;},1200);
    }
    async function processLineUserDemo(code) {
      const profile={fullName:'นาย LINE Demo User',nickname:'LINE',email:'line.demo@inbiology.com',school:'โรงเรียนทดสอบ',level:'ม.6',role:'student',authProvider:'line_demo'};
      AppState.userRole='student';sessionStorage.setItem('inbiology_session_active','true');localStorage.setItem('inbiology_role','student');AppState.saveStudentProfile(profile);
      showSuccess('LINE User (Demo)');
      const r=sessionStorage.getItem('line_redirect')||'classroom.html';sessionStorage.removeItem('line_redirect');
      setTimeout(()=>{location.href=r;},1500);
    }
    async function handleLineCallback() {
      const p=new URLSearchParams(window.location.search);
      const code=p.get('code'),state=p.get('state'),err=p.get('error');
      if(err){showError('LINE ปฏิเสธการเข้าถึง: '+(p.get('error_description')||err));return;}
      const saved=sessionStorage.getItem('line_oauth_state');
      if(!state||state!==saved){showError('State ไม่ตรงกัน กรุณาลองใหม่');return;}
      sessionStorage.removeItem('line_oauth_state');
      if(!code){showError('ไม่ได้รับ authorization code');return;}
      const hp=new URLSearchParams(window.location.hash.replace('#',''));
      const idTok=hp.get('id_token');
      if(idTok){const pl=decodeJwt(idTok);if(pl){await processLineUser(pl);return;}}
      const channelId=window.LINE_CONFIG?window.LINE_CONFIG.lineChannelId:'';
      if(!channelId){await processLineUserDemo(code);return;}
      try {
        const r=await fetch('/api/line-token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,redirectUri:window.LINE_CONFIG.lineCallbackUrl})});
        if(!r.ok){await processLineUserDemo(code);return;}
        const d=await r.json();
        if(d.error){showError(d.error_description||d.error);return;}
        if(d.id_token){const pl=decodeJwt(d.id_token);if(pl){await processLineUser({...pl,access_token:d.access_token});return;}}
        await processLineUserDemo(code);
      } catch(e){await processLineUserDemo(code);}
    }
    document.addEventListener('DOMContentLoaded',handleLineCallback);
  </script>
</body>
</html>
